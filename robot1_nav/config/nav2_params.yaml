amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.25
    alpha2: 0.25
    alpha3: 0.25
    alpha4: 0.25
    alpha5: 0.2
    base_frame_id: robot1_base
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: -1.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field_prob
    max_beams: 60
    max_particles: 1500
    min_particles: 400
    odom_frame_id: robot1_odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.03
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: /scan_filtered
    set_initial_pose: true
    initial_pose:
      x: 0.0016854011919349432
      y: -0.00030811282340437174
      z: 0.0
      yaw: 0.00948
    always_reset_initial_pose: true
